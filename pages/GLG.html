<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEEP Governador Luiz Gonzaga</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <style>
        .em-processo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 60px 20px;
            min-height: 50vh;
        }
        .badge {
            background: var(--warning);
            color: #fff;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .em-processo h2 {
            margin: 0;
            font-size: 1.75rem;
        }
        .em-processo p {
            color: var(--muted);
            margin: 0;
            text-align: center;
        }
        .em-processo .btnVoltar {
            margin-top: 8px;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ativar modo claro" title="Ativar modo claro">☾</button>
        <h1>EEEP Governador Luiz Gonzaga</h1>
    </header>

    <main>
        <div class="em-processo">
            <span class="badge">Em processo</span>
            <h2>Conteúdo em breve</h2>
            <p>Estamos preparando as informações desta escola.</p>
            <a class="btnVoltar" href="../index.html">← Voltar para o início</a>
        </div>
    </main>

    <footer>
        <p>© 2026 EEEP's Maracanaú. All rights reserved.</p>
    </footer>

    <script src="../script/script.js"></script>
</body>
</html>
